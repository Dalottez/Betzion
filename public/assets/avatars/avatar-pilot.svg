<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg-pilot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="glasses-lens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba470"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg-pilot)"/>
  <!-- Leather Jacket -->
  <path d="M15,95 C18,72 32,68 50,68 C68,68 82,72 85,95 Z" fill="#3e2723"/>
  <!-- Shearling Collar -->
  <path d="M30,68 C35,68 40,78 40,88 L30,88 Z" fill="#d7ccc8"/>
  <path d="M70,68 C65,68 60,78 60,88 L70,88 Z" fill="#d7ccc8"/>
  <!-- Head -->
  <ellipse cx="50" cy="46" rx="20" ry="22" fill="url(#skin)"/>
  <!-- Pilot Cap / Hair -->
  <path d="M28,38 C28,24 38,18 50,18 C62,18 72,24 72,38 C68,30 32,30 28,38 Z" fill="#1b1b1b"/>
  <!-- Aviator Sunglasses -->
  <!-- Left Teardrop Lens -->
  <path d="M32,40 C32,36 48,36 48,40 C48,54 44,56 36,54 C32,50 32,44 32,40 Z" fill="url(#glasses-lens)"/>
  <!-- Right Teardrop Lens -->
  <path d="M52,40 C52,36 68,36 68,40 C68,44 68,50 64,54 C56,56 52,54 52,40 Z" fill="url(#glasses-lens)"/>
  <!-- Bridge & Brow Bar -->
  <line x1="30" y1="38" x2="70" y2="38" stroke="#fbbf24" stroke-width="1.8"/>
  <line x1="47" y1="41" x2="53" y2="41" stroke="#fbbf24" stroke-width="1.5"/>
  <!-- Lens Flare -->
  <line x1="35" y1="42" x2="43" y2="50" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="55" y1="42" x2="63" y2="50" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- Smirk -->
  <path d="M44,60 C48,63 54,62 56,60" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
